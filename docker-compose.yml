version: '3.8'

services:
  # Redis for message queue, state management, and caching
  redis:
    image: redis:7-alpine
    container_name: linkedin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - linkedin-network

  # Main LinkedIn automation application
  linkedin-app:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: linkedin-automation
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - LINKEDIN_HEADLESS=true
      - LINKEDIN_BROWSER_TYPE=playwright
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - linkedin_sessions:/app/sessions
    ports:
      - "8080:8080"  # Web dashboard (if enabled)
    networks:
      - linkedin-network
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; import sys; sys.path.insert(0, 'src'); from src.infrastructure.health_check import health_check; asyncio.run(health_check())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Account Manager Agent (dedicated instance)
  account-manager:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: linkedin-account-manager
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - LINKEDIN_HEADLESS=true
      - LINKEDIN_BROWSER_TYPE=playwright
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - account_sessions:/app/sessions
    command: ["--agents", "account_manager"]
    networks:
      - linkedin-network

  # Content Analysis Agent (dedicated instance)
  content-analyzer:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: linkedin-content-analyzer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["--agents", "content_analysis"]
    networks:
      - linkedin-network

  # Interaction Agent (dedicated instance)
  interaction-agent:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: linkedin-interaction-agent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      account-manager:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - LINKEDIN_HEADLESS=true
      - LINKEDIN_BROWSER_TYPE=playwright
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - interaction_sessions:/app/sessions
    command: ["--agents", "interaction"]
    networks:
      - linkedin-network

  # Conversation Agent (dedicated instance)
  conversation-agent:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: linkedin-conversation-agent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      content-analyzer:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["--agents", "conversation"]
    networks:
      - linkedin-network

  # Safety Agent (dedicated instance)
  safety-agent:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: linkedin-safety-agent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["--agents", "safety"]
    networks:
      - linkedin-network

  # Scheduler Agent (dedicated instance)
  scheduler-agent:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: linkedin-scheduler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["--agents", "scheduler"]
    networks:
      - linkedin-network

  # Analytics Agent (dedicated instance)
  analytics-agent:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: linkedin-analytics
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["--agents", "analytics"]
    networks:
      - linkedin-network

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: linkedin-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - linkedin-network
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: linkedin-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - linkedin-network
    profiles:
      - monitoring

volumes:
  redis_data:
  linkedin_sessions:
  account_sessions:
  interaction_sessions:
  prometheus_data:
  grafana_data:

networks:
  linkedin-network:
    driver: bridge
    name: linkedin-automation-network